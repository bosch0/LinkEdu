<div class="flex min-h-screen flex-col overflow-x-clip bg-sunken max-lg:pb-pestanas">
  <!-- Franja de colores de la marca -->
  <div class="flex h-1.5 max-lg:hidden" aria-hidden="true">
    <span class="flex-[4] bg-marino"></span>
    <span class="flex-[2] bg-azul"></span>
    <span class="flex-[2] bg-turquesa"></span>
    <span class="flex-1 bg-amarillo"></span>
    <span class="flex-1 bg-naranja"></span>
  </div>

  <!-- ===================== Cabecera del ordenador ===================== -->
  <header
    class="sticky top-0 z-30 flex flex-wrap items-center gap-6 border-b border-line bg-white px-8 py-3 max-lg:hidden"
  >
    <a
      routerLink="/"
      class="flex transition-transform duration-200 hover:scale-105 active:scale-95"
    >
      <img class="h-11" src="logo-linkedu.svg" alt="LinkEdu" />
    </a>

    <app-buscador />

    <div class="flex-1"></div>

    <nav class="flex flex-wrap gap-7 font-bold" aria-label="Principal">
      @for (e of enlaces; track e.ruta) {
        <a
          [routerLink]="e.ruta"
          routerLinkActive
          #activo="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: e.ruta === '/' }"
          [attr.aria-current]="activo.isActive ? 'page' : null"
          class="group relative flex h-11 items-center gap-2 transition-colors duration-200 after:absolute after:inset-x-0 after:bottom-0 after:h-[3px] after:rounded-full after:bg-marino after:transition-transform after:duration-300"
          [class]="
            activo.isActive
              ? 'text-marino after:scale-x-100'
              : 'text-ink-muted after:scale-x-0 hover:text-marino hover:after:scale-x-50'
          "
        >
          <span
            class="transition-transform duration-200 group-hover:-translate-y-0.5 group-hover:scale-110"
          >
            <app-icono [nombre]="e.icono" />
          </span>
          {{ e.texto }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="presionar relative flex h-11 w-11 items-center justify-center rounded-full text-ink-muted hover:bg-sunken hover:text-marino"
      [attr.aria-label]="
        sinLeer() ? 'Notificaciones: ' + sinLeer() + ' sin leer' : 'Notificaciones'
      "
      (click)="abrirNotificaciones()"
    >
      <app-icono nombre="notificaciones" [tam]="22" />
      @if (sinLeer()) {
        <span
          animate.leave="animate-menu-fuera"
          class="absolute top-1 right-1 flex h-4.5 min-w-4.5 items-center justify-center rounded-full border-2 border-white bg-danger px-1 text-[10px] leading-none font-bold text-white"
          aria-hidden="true"
          >{{ sinLeer() }}</span
        >
      }
    </button>

    <a
      routerLink="/perfil"
      class="flex rounded-[10px] transition duration-200 hover:scale-110 hover:shadow-[0_0_0_3px_var(--color-turquesa)] active:scale-95"
    >
      <img
        class="h-10 w-10 rounded-[10px] object-cover"
        [src]="fotoPerfil"
        alt="Tu perfil: Lucía Fernández Ortega"
      />
    </a>
  </header>

  <!-- ===================== Barra de arriba del teléfono ===================== -->
  <header
    class="sticky top-0 z-30 border-b border-line bg-white pt-[env(safe-area-inset-top)] lg:hidden"
  >
    <div class="flex h-1" aria-hidden="true">
      <span class="flex-[4] bg-marino"></span>
      <span class="flex-[2] bg-azul"></span>
      <span class="flex-[2] bg-turquesa"></span>
      <span class="flex-1 bg-amarillo"></span>
      <span class="flex-1 bg-naranja"></span>
    </div>
    <div class="flex h-14 items-center gap-2.5 px-3">
      @if (conVolver()) {
        <button
          type="button"
          class="presionar flex h-10 w-10 flex-none items-center justify-center rounded-full text-ink hover:bg-sunken"
          aria-label="Volver"
          (click)="volver()"
        >
          <span class="rotate-180"><app-icono nombre="flecha" [tam]="22" /></span>
        </button>
      } @else {
        <a
          routerLink="/perfil"
          class="presionar flex flex-none rounded-full shadow-[0_0_0_2px_#fff,0_0_0_3.5px_var(--color-turquesa)]"
          aria-label="Tu perfil"
        >
          <img
            class="h-9 w-9 rounded-full object-cover"
            [src]="fotoPerfil"
            alt=""
            data-sin-perfil
          />
        </a>
      }

      <div class="flex min-w-0 flex-1 [&_label]:h-10">
        <app-buscador />
      </div>

      <button
        type="button"
        class="presionar relative flex h-10 w-10 flex-none items-center justify-center rounded-full text-ink hover:bg-sunken"
        [attr.aria-label]="
          sinLeer() ? 'Notificaciones: ' + sinLeer() + ' sin leer' : 'Notificaciones'
        "
        (click)="abrirNotificaciones()"
      >
        <app-icono nombre="notificaciones" [tam]="22" />
        @if (sinLeer()) {
          <span
            animate.leave="animate-menu-fuera"
            class="absolute top-0.5 right-0.5 flex h-4.5 min-w-4.5 items-center justify-center rounded-full border-2 border-white bg-danger px-1 text-[10px] leading-none font-bold text-white"
            aria-hidden="true"
            >{{ sinLeer() }}</span
          >
        }
      </button>
    </div>
  </header>

  <router-outlet />

  <!-- ===================== Pestañas de abajo del teléfono ===================== -->
  <nav
    class="fixed inset-x-0 bottom-0 z-40 grid grid-cols-5 border-t border-line bg-white/95 pb-[env(safe-area-inset-bottom)] shadow-[0_-4px_16px_rgba(7,49,87,0.06)] backdrop-blur-md lg:hidden"
    aria-label="Principal"
  >
    @for (e of enlaces; track e.ruta) {
      <a
        [routerLink]="e.ruta"
        routerLinkActive
        #pestana="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: e.ruta === '/' }"
        [attr.aria-current]="pestana.isActive ? 'page' : null"
        class="relative flex h-16 flex-col items-center justify-center gap-1 text-[11px] leading-3.5 font-bold transition-colors duration-200 before:absolute before:top-0 before:h-[3px] before:w-10 before:rounded-b-full before:bg-marino before:transition-transform before:duration-300 active:bg-sunken"
        [class]="
          pestana.isActive ? 'text-marino before:scale-x-100' : 'text-ink-muted before:scale-x-0'
        "
      >
        <span
          class="relative flex h-7 w-14 items-center justify-center rounded-full transition-colors duration-300"
          [class.bg-marino-soft]="pestana.isActive"
        >
          <span [class.animate-pop]="pestana.isActive"
            ><app-icono [nombre]="e.icono" [tam]="22"
          /></span>
          @if (e.aviso) {
            <span
              class="absolute -top-1 right-1.5 flex h-4.5 min-w-4.5 items-center justify-center rounded-full border-2 border-white bg-danger px-1 text-[10px] leading-none font-bold text-white"
              >{{ e.aviso }}<span class="sr-only"> nuevas</span></span
            >
          }
        </span>
        {{ e.texto }}
      </a>
    }
  </nav>
</div>

<!-- ===================== Hoja: notificaciones ===================== -->
<app-ventana
  [abierta]="notifAbiertas()"
  kicker="TU ACTIVIDAD"
  titulo="Notificaciones"
  [ancho]="520"
  (cerrar)="cerrarNotificaciones()"
>
  <ul class="flex flex-col pb-2">
    @for (n of notificaciones; track n.id; let i = $index) {
      <li
        class="animate-subir border-t border-sunken first:border-t-0"
        [style.animation-delay.ms]="i * 50"
      >
        <button
          type="button"
          class="flex w-full items-start gap-3 px-5 py-3.5 text-left transition-colors hover:bg-paper"
          [class.bg-azul-soft]="n.nueva && !leidas()"
          (click)="irA(n.ruta)"
        >
          <span class="relative mt-0.5 flex flex-none">
            <img
              class="h-12 w-12 rounded-full border border-line bg-white"
              [class]="n.esPersona ? 'object-cover' : 'object-contain p-1'"
              [src]="n.foto"
              alt=""
            />
            <span
              class="absolute -right-1 -bottom-1 flex h-6 w-6 items-center justify-center rounded-full border-2 border-white {{
                n.clases
              }}"
              aria-hidden="true"
              ><app-icono [nombre]="n.icono" [tam]="12"
            /></span>
          </span>
          <span class="min-w-0 flex-1 text-[15px] leading-5.5">
            {{ n.pre }} <strong>{{ n.fuerte }}</strong> {{ n.post }}
            <span class="mt-0.5 block font-mono text-xs text-ink-muted">{{ n.cuando }}</span>
          </span>
          @if (n.nueva && !leidas()) {
            <span class="mt-2 h-2.5 w-2.5 flex-none rounded-full bg-azul"
              ><span class="sr-only">Sin leer</span></span
            >
          }
        </button>
      </li>
    }
  </ul>
</app-ventana>
